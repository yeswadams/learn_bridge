name: learn_bridge
description: "An e-learning app for students and admins."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Go Router
  go_router: ^14.0.0
  
  provider: ^6.1.2       # Ensure provider is here
  
  http: ^1.2.0 # For Flask API network communication

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Asset pipeline initialization for your onboarding and splash visuals
  assets:
    - assets/images/
